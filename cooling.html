const D=JSON.parse(document.querySelector('#project-data').textContent),$=s=>document.querySelector(s),fmt=(v,n=0)=>v.toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n});
const C={cyan:'#28d8ff',blue:'#579af8',purple:'#a18bff',gold:'#ffc857',green:'#36d6a0',red:'#ff697e',gray:'#7996b9'};
const calc={cop:D.cooling/D.electricity,residual:D.electricity-D.chillerElectricity,carbon:D.electricity*D.factor/1000,baseCarbon:D.baselineElectricity*D.factor/1000,deltaElectricity:D.electricity-D.baselineElectricity};
const modules=['系统总览','负荷与能源','冰蓄冷优化','能效分析','经济性评价','碳排放分析','数据与决策'];let current=0,scenario=0,returnFocus=null;
function panel(title,body,extra=''){return `<section class="panel"><div class="panelhead"><h3>${title}</h3>${extra}</div><div class="pad">${body}</div></section>`}
function note(t){return `<div class="insight">${t}</div>`}function table(headers,rows,cls=''){return `<div class="datawrap ${cls}"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function stat(l,v,u,col='cyan'){return `<div class="statbox"><span class="muted">${l}</span><b style="color:${C[col]}">${v}<span class="unit">${u}</span></b></div>`}
function svg(content,h=250){return `<svg class="chart" viewBox="0 0 600 ${h}" role="img">${content}</svg>`}function tip(t){return `tabindex="0" data-tip="${t}"`}
function bars(items,max,unit){return svg(`<text x="18" y="24">${unit} · 各行共用此单位</text>`+items.map((r,i)=>{let y=58+i*61,w=r[1]/max*345;return `<g ${tip(r[0]+'：'+fmt(r[1],r[3]??2)+' '+unit)}><text x="18" y="${y}">${r[0]}</text><rect x="175" y="${y-14}" width="${w}" height="9" rx="4" fill="${r[2]}"/><text class="val" x="175" y="${y+24}">${fmt(r[1],r[3]??2)}</text></g>`}).join(''),50+61*items.length)}
function donut(){let p=D.chillerElectricity/D.electricity;return svg(`<circle cx="148" cy="123" r="76" fill="none" stroke="${C.purple}" stroke-width="21"/><circle ${tip('冷源主机：1,174,855.75 kWh；直接给定')} cx="148" cy="123" r="76" fill="none" stroke="${C.cyan}" stroke-width="21" pathLength="100" stroke-dasharray="${p*100} ${100-p*100}" transform="rotate(-90 148 123)"/><text class="val" x="148" y="121" text-anchor="middle" style="font-size:26px">68.51%</text><text x="148" y="144" text-anchor="middle">主机电耗占比</text><rect x="270" y="70" width="4" height="45" fill="${C.cyan}"/><text x="286" y="85">冷源主机</text><text class="val" x="286" y="111">1,174,855.75 kWh</text><rect x="270" y="139" width="4" height="45" fill="${C.purple}"/><text x="286" y="154">蓄冷与辅机 · 残差</text><text class="val" x="286" y="180">539,894.76 kWh</text>`,240)}
function linechart(){let s='';[100,200,300,400].forEach(v=>{let y=235-v/400*190;s+=`<line class="grid" x1="65" y1="${y}" x2="555" y2="${y}"/><text x="55" y="${y+5}" text-anchor="end">${v}</text>`});s+='<text x="14" y="22">万元/年</text>';['tac','baselineTac'].forEach((key,k)=>{let pts=D.scenarios.map((d,i)=>`${100+i*210},${235-d[key]/4000000*190}`);s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${k?C.gray:C.cyan}" stroke-width="3"/>`;D.scenarios.forEach((d,i)=>{let x=100+i*210,y=235-d[key]/4000000*190;s+=`<circle ${tip(d.name+' / '+(k?'无蓄冷基准':'冰蓄冷方案')+' TAC：'+fmt(d[key])+' 元/年')} cx="${x}" cy="${y}" r="7" fill="${k?C.gray:C.cyan}" stroke="#0b2048" stroke-width="3"/>`})});D.scenarios.forEach((d,i)=>s+=`<text x="${100+i*210}" y="268" text-anchor="middle">${d.name}</text>`);s+=`<text x="80" y="300" style="fill:${C.cyan}">━ 冰蓄冷方案</text><text x="300" y="300">━ 无蓄冷基准</text>`;return svg(s,320)}
function costchart(){let s='<text x="18" y="23">元/kWh冷 · 图示源于原文件四位小数</text>';for(let j=0;j<5;j++){let y=230-j*.1/.4*170;s+=`<line class="grid" x1="60" y1="${y}" x2="570" y2="${y}"/><text x="48" y="${y+5}" text-anchor="end">${(j*.1).toFixed(1)}</text>`}D.scenarios.forEach((d,i)=>{let x=145+i*170;['unitCost','baselineUnitCost'].forEach((k,j)=>{let h=d[k]/.4*170;s+=`<rect ${tip(d.name+' '+(j?'基准':'蓄冷')+'：'+d[k].toFixed(4)+' 元/kWh冷')} x="${x+j*30-25}" y="${230-h}" width="16" height="${h}" rx="3" fill="${j?C.gray:C.cyan}"/>`});s+=`<text x="${x}" y="257" text-anchor="middle">${d.name}</text>`});return svg(s+'<text x="110" y="291" style="fill:#28d8ff">■ 冰蓄冷</text><text x="300" y="291">■ 无蓄冷基准</text>',310)}
function delta(l,a,b,u,n=2){let d=a-b;return `<div class="row"><span>${l}</span><strong style="color:${d>0?C.red:C.green}">${d>0?'+':'−'}${fmt(Math.abs(d),n)} ${u}</strong></div>`}
function kpis(){let data=[['设计冷负荷',fmt(D.load),'kW','设计参数',1],['年供冷量',fmt(D.cooling/1e6,4),'GWh/年','需求侧交付冷量',1],['冷水机组',D.units+' × '+fmt(D.capacity),'kW','水冷 · 离心式',0],['冰蓄冷率',fmt(D.storageRate),'%','设计蓄冷量 29,180 kWh',2],['年系统电耗',fmt(D.electricity/1e6,4),'GWh/年','含主机、蓄冷与输配',3],['季节平均 COP',fmt(calc.cop,3),'','年冷量 / 年电耗',3],['年电费',fmt(D.bill/1e4,4),'万元','计算结果',4],['年碳排放',fmt(calc.carbon,2),'tCO₂','广东省级 · 2023 年',5]];return `<div class="kpis">${data.map((a,i)=>`<button class="kpi" data-go="${a[4]}" ${i===2?'data-device="chiller"':''} style="--accent:${i===3?C.purple:i===6?C.gold:i===7?C.red:C.cyan}"><div class="label">${a[0]}</div><div class="value" style="${i===2?'font-size:24px':''}">${a[1]}<span class="unit">${a[2]}</span></div><small>${a[3]}</small></button>`).join('')}</div>`}
function compactLine(){return linechart().replace('600 320','600 180').replace(/(y|y1|y2|cy)="([0-9.]+)"/g,(_,k,v)=>k+'="'+(+v*.56)+'"').replace(/points="([^"]+)"/g,(_,v)=>'points="'+v.split(' ').map(p=>{let [x,y]=p.split(',');return x+','+(+y*.56)}).join(' ')+'"')}
function compactDonut(){return svg(`<circle cx="92" cy="86" r="55" fill="none" stroke="${C.purple}" stroke-width="14"/><circle cx="92" cy="86" r="55" fill="none" stroke="${C.cyan}" stroke-width="14" pathLength="100" stroke-dasharray="${D.chillerElectricity/D.electricity*100} ${100-D.chillerElectricity/D.electricity*100}" transform="rotate(-90 92 86)"/><text class="val" x="92" y="85" text-anchor="middle">68.51%</text><text x="92" y="107" text-anchor="middle">主机占比</text><text x="192" y="50" style="fill:${C.cyan}">冷源主机 · 直接给定</text><text class="val" x="192" y="77">1,174,855.75 kWh</text><text x="192" y="116" style="fill:${C.purple}">蓄冷与辅机 · 残差</text><text class="val" x="192" y="143">539,894.76 kWh</text>`,180)}
function compactCOP(){return svg(`<text x="15" y="32">额定机组 COP</text><rect x="200" y="20" width="252" height="8" rx="4" fill="${C.blue}"/><text class="val" x="480" y="32">6.30</text><text x="15" y="83">季节系统 COP</text><rect x="200" y="71" width="220.24" height="8" rx="4" fill="${C.cyan}"/><text class="val" x="480" y="83">5.506</text><text x="15" y="130">边界不同，不可由差值归因单项损耗。</text><text x="15" y="160">无量纲 · 共同零点 / 同比例长度</text>`,180)}
function overview(){return kpis()+`<div class="cockpit">${panel('系统设计档案',`<div class="eyebrow">DESIGN ENVELOPE</div><div class="metricbig">80,000 <span class="unit">m²</span></div><div class="micro">商场 / 展览馆 · 总建筑面积</div><div class="divider"></div><div class="metrics"><div class="row"><span>空调面积</span><strong>46,000 m²</strong></div><div class="row"><span>空调面积占比</span><strong>57.5%</strong></div></div><div class="slim"><i style="width:57.5%"></i></div><div class="row"><span>装机总制冷量</span><strong>5,700 kW</strong></div><p class="micro">容量差由蓄冷参与供冷；缺少逐时负荷，尚不能独立验证峰时供冷能力。</p><div class="divider"></div><div class="row"><span>蓄冷形式</span><strong style="color:${C.purple}">冰蓄冷</strong></div><div class="row"><span>设计蓄冷量</span><strong>29,180 kWh</strong></div><div class="divider"></div><div class="micro">设备配置来自原文件；换热器、泵、塔、管网为工程示意，型号与数量待设计确认。</div>`)}<section class="panel"><div class="panelhead"><h3>供冷系统 · 三维工程场景</h3><span class="badge cyan">设计拓扑示意</span></div><div class="stage" id="stage"><svg id="twin" viewBox="0 0 1000 570" aria-label="可旋转的三维供冷系统工程示意"></svg><div class="stagehud"><b>COOLING PLANT / AXONOMETRIC</b><div>拖动旋转 · 滚轮缩放 · 点击设备查看参数</div></div></div><div class="controls"><div class="tabs" id="modes"><button data-mode="direct" class="active">直接供冷</button><button data-mode="charge">蓄冰路径</button><button data-mode="discharge">释冷路径</button></div><div><button id="flowToggle">流向：显示</button> <button id="resetView">恢复视角</button></div></div><div class="footnote"><div class="legend"><span><i></i>冷冻水供水</span><span><i style="--color:${C.blue}"></i>冷冻水回水</span><span><i style="--color:${C.gold}"></i>冷却水</span><span><i style="--color:${C.purple}"></i>载冷剂</span></div><div id="pathNote" style="margin-top:6px">直接供冷：蒸发器 → 泵 / 分水器 → 末端 → 集水器 → 蒸发器。箭头表示流体方向。</div></div></section>${panel('方案价值与代价',`<div class="row"><span>年电费节省</span><strong class="gold">42.17%</strong></div><div class="metricbig gold">52.2767 <span class="unit">万元/年</span></div><div class="micro">相对无蓄冷基准 123.9542 万元/年</div><div class="divider"></div><div class="metrics">${delta('年系统电耗',D.electricity/1e4,D.baselineElectricity/1e4,'万kWh',2)}${delta('年碳排 · 原对比表',757.7,496.4,'tCO₂',1)}${delta('峰值电功率',984.2,856,'kW',1)}</div>${note('本算例：<b class="gold">省电费</b>，同时增加电耗与碳排。移峰价值不能等同于节能减碳。')}<div class="divider"></div><div class="micro">投资结果取决于引擎造价假设。原文件缺少分时排放因子、逐时工况与实际监测数据。</div><button data-go="6" style="margin-top:14px;width:100%">查看数据校核与决策 →</button>`)}</div><div class="bottom">${panel('01 / 年电耗分配',compactDonut())}${panel('02 / COP 与评价边界',compactCOP())}${panel('03 / 造价敏感性 · TAC',compactLine())}</div>`}
function loadpage(){return `<div class="grid2">${panel('年度系统电耗结构',donut()+note('蓄冷与辅机 = 1,714,750.51 − 1,174,855.75 = <b>539,894.76 kWh</b>。仅为差额，不能据此分解水泵、冷却塔或制冰损耗。'))}${panel('需求侧与输入侧 · 独立量纲',stat('年需求侧供冷量','9.4411','GWh冷/年')+'<br>'+stat('年系统输入电量','1.7148','GWh电/年','purple')+'<p class="micro">二者不合并为构成占比。年度供冷量不是装机容量。</p>')}</div><div class="grid2" style="margin-top:18px">${panel('负荷设计边界',table(['项目','原文件数值'],[['设计冷负荷','7,015 kW'],['总建筑面积','80,000 m²'],['空调面积','46,000 m²'],['机组配置','2 台 × 2,850 kW'],['等效满负荷小时 · 复算',fmt(D.cooling/D.load,2)+' h']]))}${panel('负荷结构数据可用性','<p class="callout">暂无分建筑、分业态负荷数据</p><p class="muted">不生成商场与展馆的负荷占比，也不生成逐小时冷负荷曲线。</p>'+note('原文件“年均负荷率 81.2%”缺少可追溯的运行时长分母；本平台不沿用这一结论。'))}</div>`}
function icepage(){return `<div class="grid3">${stat('蓄冷率','50','%','purple')}${stat('设计蓄冷量','29,180','kWh冷','purple')}${stat('年电费减少','522,767','元/年','gold')}</div><div class="notice">运行模式仅用于设计路径说明。分时电量为全年各时段汇总，不代表逐时运行计划；充放冷时长、流量及制冰温度暂无数据。</div><div class="grid2">${panel('年度分时段电量变化',bars([['谷段增加',D.valley-D.baselineValley,C.purple,0],['尖峰段减少',D.baselinePeak-D.peak,C.cyan,0]],1200000,'kWh/年')+note('峰时用电量减少 ≠ 全系统最大电功率降低。原对比表峰值电功率反而增加 128.2 kW。'))}${panel('技术代价 · 分别呈现量纲',`<div class="metrics">${delta('总电耗',D.electricity,D.baselineElectricity,'kWh/年',2)}${delta('峰值电功率',D.power,D.baselinePower,'kW',1)}${delta('年碳排 · 对比表',757.7,496.4,'tCO₂/年',1)}</div><div class="divider"></div><p class="callout">以低谷电替代高价时段用电</p><p class="muted">本算例体现峰谷电价套利。系统多耗电的原因不能由年度汇总值单独辨识。</p><button data-go="0">返回三维场景切换路径 →</button>`)}</div><div style="margin-top:18px">${panel('原始分时段与功率对比',table(['指标','冰蓄冷','无蓄冷基准','差额'],[['谷段电量 / kWh',fmt(D.valley),fmt(D.baselineValley),'+1,125,331'],['尖+峰段电量 / kWh',fmt(D.peak),fmt(D.baselinePeak),'−550,822'],['峰值电功率 / kW','984.2','856.0','+128.2']])+'<p class="micro">谷段与尖峰段未覆盖全部时段，不应简单相加当作全年总电耗；原文件没有逐时曲线。</p>')}</div>`}
function efficiency(){return `<div class="grid3">${stat('季节平均 COP',fmt(calc.cop,3),'系统计算值')}${stat('单位冷量电耗',fmt(D.electricity/D.cooling,4),'kWh电/kWh冷')}${stat('等效满负荷小时',fmt(D.cooling/D.load,2),'h/年')}</div><div class="grid2" style="margin-top:18px">${panel('能效指标 · 区分评价边界',bars([['机组额定 COP',6.3,C.blue,2],['季节系统 COP',calc.cop,C.cyan,3]],8,'无量纲')+note('额定 COP 6.30 为引擎输出名义 COP_A（来源未在原文件披露）；季节 COP 为年度需求侧冷量除以含蓄冷与输配的系统电耗。'))}${panel('公式与变量来源',table(['计算项','公式 / 结果'],[['季节 COP','9,441,050.87 ÷ 1,714,750.51 = 5.505787'],['单位冷量电耗','1,714,750.51 ÷ 9,441,050.87 = 0.181627'],['等效满负荷小时','9,441,050.87 ÷ 7,015 = 1,345.84 h']])+note('原文件把季节 COP 标为“实测”，但未提供监测记录；本平台标为<b>年度计算值</b>。'))}</div><div class="notice">尚无法绘制可信的“能源损耗分解”：年度电耗残差不是热损耗，也不能识别各设备损耗。需要设备电表、供回水温度、流量与蓄冷状态数据。</div>`}
function econpage(){let d=D.scenarios[scenario];return `<div class="sectionhead"><div class="tabs" id="scenarios">${D.scenarios.map((s,i)=>`<button data-scenario="${i}" class="${i===scenario?'active':''}">${s.name}造价假设</button>`).join('')}</div><span class="badge">引擎假设 · 非核实项目造价</span></div><div class="grid3">${stat('年总费用 TAC',fmt(d.tac/1e4,4),'万元/年','gold')}${stat('投资回收期',fmt(d.payback,2),'年','gold')}${stat('单位冷量成本',d.unitCost.toFixed(4),'元/kWh冷','gold')}</div><div class="grid2" style="margin-top:18px">${panel('造价敏感性 · 年总费用 TAC',linechart())}${panel('单位冷量成本 · 三档完整对比',costchart())}${panel('投资回收期',bars(D.scenarios.map(s=>[s.name,s.payback,C.gold,2]),40,'年'))}${panel(d.name+'场景 · 投资与收益',table(['指标','引擎试算'],[['冷源单位造价',fmt(d.sourceCost)+' 元/kW'],['蓄冷单位造价',fmt(d.storageCost)+' 元/kWh'],['增量 CAPEX',fmt(d.deltaCapex)+' 元'],['原表 ΔOPEX',fmt(d.deltaOpex)+' 元/年'],['NPV',fmt(d.npv)+' 元'],['IRR',d.irr===null?'未给定':fmt(d.irr,2)+'%'],['TAC − 基准',fmt(d.tac-d.baselineTac)+' 元/年']]))}</div><div class="notice">回收期可用增量投资 ÷ 原表 ΔOPEX 近似复核。ΔOPEX 与电费节省额不同，不可互换。NPV、IRR 保留原文件值；评价期、折现率、完整现金流、基准单位造价及运维费率未完整披露，无法独立重算。</div><p class="callout">${scenario===0?'低档假设下，冰蓄冷 TAC 低于基准 166,609 元/年。':'当前造价假设下，冰蓄冷 TAC 高于无蓄冷基准。'}</p>`}
function carbonpage(){return `<div class="grid3">${stat('冰蓄冷年碳排',fmt(calc.carbon,2),'tCO₂/年','red')}${stat('基准年碳排 · 同因子复算',fmt(calc.baseCarbon,2),'tCO₂/年')}${stat('年碳排增加 · 同因子复算',fmt(calc.carbon-calc.baseCarbon,2),'tCO₂/年','red')}</div><div class="grid2" style="margin-top:18px">${panel('年度碳排放对比',bars([['冰蓄冷方案',calc.carbon,C.red,2],['无蓄冷基准',calc.baseCarbon,C.gray,2]],850,'tCO₂/年'))}${panel('碳核算口径',table(['计算项','取值与来源'],[['电力排放因子','0.4419 kgCO₂/kWh · 省级（广东）2023 年'],['冰蓄冷年碳排','1,714,750.51 × 0.4419 ÷ 1,000'],['基准年碳排','1,123,390 × 0.4419 ÷ 1,000'],['单位冷量碳强度',fmt(calc.carbon*1000/D.cooling,4)+' kgCO₂/kWh冷']])+note('该因子为省级（广东）2023 年官方值（生态环境部公告 2025 年第 47 号），已核实。缺少分时排放因子，不计算移峰产生的额外碳效益。'))}</div><div class="notice">原对比表为 757.7 与 496.4 tCO₂，差额 261.3 tCO₂；按精细电耗及同一因子复算为 757.7483 与 496.4260 tCO₂，差额 261.3222 tCO₂。差异来自展示精度；两套口径均保留可查。</div>`}

labels=[['冷却塔',[-160,-168,132],'tower'],['离心式冷水机组',[-180,15,112],'chiller'],['冰蓄冷装置',[-150,182,132],'ice'],['板式换热器',[66,157,112],'hx'],['循环泵',[38,-15,82],'pump'],['分 / 集水器',[151,-23,68],'header'],['建筑末端',[278,-10,165],'building']];

function pathOf(pts){return pts.map((p,i)=>{let a=project(p);return `${i?'L':'M'}${a[0].toFixed(2)},${a[1].toFixed(2)}`}).join(' ')}
function drawTwin(){plant();let out='<defs><filter id="groundGlow"><feGaussianBlur stdDeviation="9"/></filter></defs>';let objects=[...polys.filter(p=>p.id).map(p=>({...p,kind:'poly'})),...pipes.map(p=>({...p,kind:'pipe'}))].sort((a,b)=>a.depth-b.depth);
polys.filter(p=>!p.id).forEach(p=>{let pts=p.pts.map(a=>project(a).slice(0,2).join(',')).join(' ');out+=`<polygon points="${pts}" fill="${p.color}" stroke="#365572" stroke-width=".8"/>`});
// 地面网格始终位于设备下面。
for(let x=-350;x<=350;x+=50)out+=`<path d="${pathOf([[x,-220,-2],[x,235,-2]])}" stroke="#2b537477" stroke-width=".6"/>`;for(let y=-220;y<=235;y+=50)out+=`<path d="${pathOf([[-350,y,-2],[350,y,-2]])}" stroke="#2b537477" stroke-width=".6"/>`;
objects.forEach(p=>{if(p.kind==='poly'){let pts=p.pts.map(a=>project(a).slice(0,2).map(x=>x.toFixed(1)).join(',')).join(' ');out+=`<polygon points="${pts}" fill="${p.color}" stroke="#d0f2ff25" stroke-width=".6" ${p.id?`data-equip="${p.id}" class="equipment ${selected===p.id?'selected':''}"`:''}/>`}else{let d=pathOf(p.pts),opacity=p.active?1:.14;out+=`<g opacity="${opacity}" data-tip="${p.text} · 设计流向示意"><path d="${d}" fill="none" stroke="#07172a" stroke-width="9" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${p.color}" stroke-width="5" stroke-linejoin="round"/>`;if(p.active&&showFlow){out+=`<path d="${d}" fill="none" stroke="#eaf6ff" stroke-width="2" class="flow"/>`;for(let i=1;i<p.pts.length;i++){let a=project(p.pts[i-1]),b=project(p.pts[i]),dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len>35){let x=a[0]+dx*.6,y=a[1]+dy*.6,theta=Math.atan2(dy,dx)*180/Math.PI;out+=`<path d="M-5,-4 L3,0 L-5,4" fill="none" stroke="#eaf6ff" stroke-width="2" transform="translate(${x},${y}) rotate(${theta})"/>`}}}out+='</g>'}});
labels.forEach(([name,p,id])=>{let a=project(p);out+=`<g class="equipment" data-equip="${id}" role="button" tabindex="0" aria-label="查看${name}参数"><rect x="${a[0]-name.length*10-10}" y="${a[1]-16}" width="${name.length*20+20}" height="31" rx="4" fill="#0a1d35e8" stroke="${selected===id?C.cyan:'#406387'}"/><text x="${a[0]}" y="${a[1]+2}" font-size="19" font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#eaf6ff" text-anchor="middle">${name}</text></g>`});$('#twin').innerHTML=out}
function initTwin(){mode='direct';showFlow=true;drawTwin();const stage=$('#stage');let start=null,moved=false;stage.onpointerdown=e=>{if(e.button!==0)return;start={x:e.clientX,y:e.clientY,a:angle,e:elevation};moved=false;stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){angle=start.a+dx*.004;elevation=Math.max(.25,Math.min(1.12,start.e+dy*.003));drawTwin()}};stage.onpointerup=e=>{if(!start)return;start=null;if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);if(!moved){let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-equip]');if(el)showDevice(el.dataset.equip)}};stage.onpointercancel=()=>start=null;stage.onwheel=e=>{e.preventDefault();zoom=Math.min(1.55,Math.max(.65,zoom-e.deltaY*.001));drawTwin()};stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('[data-equip]');if(el){e.preventDefault();showDevice(el.dataset.equip)}}});$('#resetView').onclick=()=>{angle=-.54;elevation=.58;zoom=1;drawTwin()};$('#flowToggle').onclick=e=>{showFlow=!showFlow;e.target.textContent='流向：'+(showFlow?'显示':'隐藏');drawTwin()};$('#modes').onclick=e=>{let b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;$('#modes').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));$('#pathNote').textContent={direct:'直接供冷：蒸发器 → 泵 / 分水器 → 末端 → 集水器 → 蒸发器。箭头表示流体方向。',charge:'蓄冰示意：制冰冷源 ↔ 蓄冰装置；冷凝热由冷却塔排放。制冰工况参数与阀组设计待核。',discharge:'释冷示意：冰罐 ↔ 板换（载冷剂）；板换 ↔ 末端（冷冻水）。两侧流体不混合。'}[mode];drawTwin()}}
if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.body.classList.add('still');
render();
