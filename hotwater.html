const D=JSON.parse(document.querySelector('#project-data').textContent),idx=n=>modules.indexOf(n),$=s=>document.querySelector(s),fmt=(v,n=0)=>v.toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n});
const C={cyan:'#28d8ff',blue:'#579af8',purple:'#a18bff',gold:'#ffc857',green:'#36d6a0',red:'#ff697e',gray:'#7996b9',heat:'#ffb35c'};
const calc={heatDifference:D.sourceHeat-D.userHeat,heatDifferenceRatio:(D.sourceHeat-D.userHeat)/D.sourceHeat*100,loadReduction:D.unbufferedLoad-D.bufferedLoad,loadReductionRatio:(D.unbufferedLoad-D.bufferedLoad)/D.unbufferedLoad*100,impliedAnnualWater:D.revenue/D.price,carbonUser:D.carbon*1000/D.userHeat,carbonSource:D.carbon*1000/D.sourceHeat};
const modules=['系统总览','需求与热量','热源选型','储热容量','技术经济','碳排放','数据与决策'];let current=0,returnFocus=null,assumedPrice=35;
function panel(title,body,extra=''){return `<section class="panel"><div class="panelhead"><h3>${title}</h3>${extra}</div><div class="pad">${body}</div></section>`}
function note(t){return `<div class="insight">${t}</div>`}function table(headers,rows,wrap){return `<div class="datawrap${wrap?' wrapc':''}${wrap==='nw1'?' nw1':''}"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function stat(l,v,u,col='cyan'){return `<div class="statbox"><span class="muted">${l}</span><b style="color:${C[col]}">${v}<span class="unit">${u}</span></b></div>`}
function svg(content,h=250){return `<svg class="chart" viewBox="0 0 600 ${h}" role="img">${content}</svg>`}function tip(t){return `tabindex="0" data-tip="${t}"`}
function bars(items,max,unit){return svg(`<text x="18" y="24">${unit} · 各行共用此单位</text>`+items.map((r,i)=>{let y=58+i*61,w=r[1]/max*345;return `<g ${tip(r[0]+'：'+fmt(r[1],r[3]??2)+' '+unit)}><text x="18" y="${y}">${r[0]}</text><rect x="175" y="${y-14}" width="${w}" height="9" rx="4" fill="${r[2]}"/><text class="val" x="175" y="${y+24}">${fmt(r[1],r[3]??2)}</text></g>`}).join(''),50+61*items.length)}
function kpis(){const a=[['日用水量',fmt(D.dailyWater),'m³/日','需求与热量','cyan'],['用户侧年热量',fmt(D.userHeat/1e6,4),'GWh/年','需求与热量','heat'],['储热容积',fmt(D.storageVolume,2),'m³','储热容量','purple'],['配储热小时负荷',fmt(D.bufferedLoad,2),'kW','储热容量','heat'],['初始总投资',fmt(D.capex/1e4,2),'万元','技术经济','gold'],['年利润总额',fmt(D.profit/1e4,2),'万元/年','技术经济','gold'],['静态回收期',fmt(D.staticPayback,2),'年','技术经济','gold'],['年碳排放',fmt(D.carbon,2),'tCO₂','碳排放','red']];return `<div class="kpis">${a.map(x=>`<button class="kpi" data-go="${idx(x[3])}" style="--accent:${C[x[4]]}"><div class="label">${x[0]}</div><div class="value">${x[1]}<span class="unit">${x[2]}</span></div><small>${x[3]}</small></button>`).join('')}</div>`}
function investment(compact=false){let rows=[['热源设备',D.sourceInvestment,C.blue],['储热设备',D.storageInvestment,C.purple],['配套与安装',D.installationInvestment,C.green]],offset=0;let h=compact?180:260,cy=compact?86:122,r=compact?57:78;let s='';rows.forEach((a,i)=>{let p=a[1]/D.capex*100;s+=`<circle ${tip(a[0]+'：'+fmt(a[1])+' 元，占 '+fmt(p,2)+'%')} cx="110" cy="${cy}" r="${r}" pathLength="100" fill="none" stroke="${a[2]}" stroke-width="${compact?15:23}" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-offset}" transform="rotate(-90 110 ${cy})"/>`;offset+=p;let y=(compact?44:65)+i*(compact?48:65);s+=`<text x="235" y="${y}" style="fill:${a[2]}">${a[0]} · ${fmt(p,1)}%</text><text class="val" x="235" y="${y+23}">${fmt(a[1]/1e4,2)} 万元</text>`});return svg(s+`<text class="val" text-anchor="middle" x="110" y="${cy}">25.22</text><text text-anchor="middle" x="110" y="${cy+22}">万元 · 合计</text>`,h)}
function waterfall(compact=false){let height=compact?190:300,base=compact?135:235,top=compact?35:45,scale=(base-top)/60;let rows=[['售水收入',0,53.65,C.cyan],['运行成本',22.04,53.65,C.red],['净现金流',0,22.04,C.green],['非现金折旧',20.36,22.04,C.gray],['利润总额',0,20.36,C.gold]],s=`<text x="12" y="18">万元/年 · 原文件口径</text>`;[0,20,40,60].forEach(v=>{let y=base-v*scale;s+=`<line class="grid" x1="48" x2="580" y1="${y}" y2="${y}"/><text x="42" y="${y+5}" text-anchor="end">${v}</text>`});rows.forEach((a,i)=>{let x=86+i*104,y=base-a[2]*scale,h=(a[2]-a[1])*scale;s+=`<rect ${tip(a[0]+'：'+(i===1?'−31.61':i===3?'−1.68':(a[2]).toFixed(2))+' 万元/年')} x="${x}" y="${y}" width="28" height="${Math.max(h,3)}" rx="2" fill="${a[3]}"/><text class="val" x="${x+14}" y="${y-9}" text-anchor="middle">${i===1?'−31.61':i===3?'−1.68':a[2].toFixed(2)}</text><text x="${x+14}" y="${base+28}" text-anchor="middle">${a[0]}</text>`;if(i<4){let val=i===0?53.65:i===3?20.36:22.04;s+=`<line x1="${x+28}" y1="${base-val*scale}" x2="${x+104}" y2="${base-val*scale}" stroke="#7996b9" stroke-dasharray="3 3"/>`}});return svg(s,height)}
function heatSplit(compact=false){let useful=D.userHeat/D.sourceHeat*100;return svg(`<text x="16" y="26">热源侧原报值 866,479 kWh/年</text><g ${tip('用户侧有效热量：802,296 kWh；差额：64,183 kWh')}><rect x="16" y="52" width="560" height="22" rx="5" fill="${C.red}"/><rect x="16" y="52" width="${560*useful/100}" height="22" rx="5" fill="${C.heat}"/></g><text class="val" x="16" y="110" style="fill:${C.heat}">用户侧 92.59%</text><text class="val" x="330" y="110" style="fill:${C.red}">热量差额 7.41%</text><text x="16" y="143">64,183 kWh = 用户侧 × 8.0%（管网与储罐热损）</text>`,compact?180:185)}
function overview(){return kpis()+`<div class="cockpit">${panel('设计需求与热源',`<div class="eyebrow">DESIGN ENVELOPE</div><div class="metricbig">${fmt(D.dailyWater,0)} <span class="unit">m³/日</span></div><div class="micro">热水需求 · 原文件报告口径（原文只给 ${fmt(D.dailyWater,2)} 这一个结果，未列人数与定额）</div><div class="calc">${fmt(D.unitCount,0)} 人 × ${fmt(D.unitQuota,0)} L/(人·日) ÷ 1000<br>= <b>${fmt(D.dailyWater,0)} m³/日</b></div><p class="micro" style="margin-top:6px;line-height:1.6">人数 = ${fmt(D.unitCount/2,0)} 间客房 × 2 人/间（客房数取自原始提问，人/间为取整假设），定额 ${fmt(D.unitQuota,0)} L 取酒店热水常用值 —— 两项都非原报告字段，由上式反推得出，且只被约束到乘积 ${fmt(D.unitCount*D.unitQuota,0)} L。</p><div class="divider"></div><div class="metrics"><div class="row"><span>无储热小时负荷</span><strong>457.93 kW</strong></div><div class="row"><span>配储热小时负荷</span><strong class="warm">183.70 kW</strong></div><div class="row"><span>设计负荷降低</span><strong class="green">${fmt(calc.loadReductionRatio,2)}%</strong></div></div><div class="divider"></div><div class="row"><span>储热容积</span><strong style="color:${C.purple}">28.24 m³</strong></div><div class="row"><span>热源热效率</span><strong>0.93</strong></div><p class="micro">效率沿用原文件低位热值口径；热源侧热量 = 用户侧 × 1.08，差额即 8% 管网与储罐综合热损，非燃料侧混用。</p><div class="divider"></div><p class="micro">热源为<b>商用燃气热水机组</b>（gas_heater），设计供水 <b>60 ℃</b> / 冷水 <b>15 ℃</b>（储热温差 45 ℃），年耗天然气 <b>8.60 万 m³</b>；仅单机型号、台数与实时流量原文件未给出。场景为工程功能示意。</p>`)}<section class="panel mid"><div class="panelhead"><h3>供热水系统 · 三维工程场景</h3><span class="badge cyan">设计拓扑示意</span></div><div class="stage" id="stage"><svg id="twin" viewBox="0 0 1000 570" aria-label="可操作的三维供热水系统示意"></svg><div class="stagehud"><b>HOT WATER PLANT / AXONOMETRIC</b><div>拖动旋转 · 滚轮缩放 · 点击设备查看参数</div></div></div><div class="controls"><div class="tabs" id="modes"><button data-mode="direct" class="active">供热水路径</button><button data-mode="charge">储热路径</button><button data-mode="return">循环回水</button></div><div><button id="flowToggle">流向：显示</button> <button id="resetView">恢复视角</button></div></div><div class="footnote"><div class="legend"><span><i style="--color:${C.heat}"></i>热水供水</span><span><i style="--color:${C.blue}"></i>冷水 / 回水</span><span><i style="--color:${C.purple}"></i>储热回路</span></div><div id="pathNote" style="margin-top:6px">热水供水：热源换热 → 储热 / 混水 → 供水泵 → 末端用水。仅示意设计流向。</div></div></section>${panel('经济结果与评价边界',`<div class="row"><span>原算例 IRR</span><strong class="gold">87.41%</strong></div><div class="metricbig gold">22.04 <span class="unit">万元/年</span></div><div class="micro">净现金流 · 收入减运行成本</div><div class="divider"></div><div class="metrics"><div class="row"><span>售水单价</span><strong>35.00 元/m³</strong></div><div class="row"><span>单位完全成本</span><strong>21.72 元/m³</strong></div><div class="row"><span>税前单位利润</span><strong class="green">13.28 元/m³</strong></div></div>${note('税前测算，<b class="gold">未计人工 / 维修费</b>。评价期 15 年、折现率 8%、天然气 3.45 元/m³ 均已定；NPV = <b>163.48 万元</b>（−25.217 + 22.045 × 8.5595，零税零残值）。人工与维修费仍不在原算例内。')}<div class="divider"></div><p class="micro">静态回收期 1.14 年、动态回收期 1.25 年、IRR 87.41% 均已在零税零残值口径下复算（口径见「技术经济」页）。</p><button data-go="${idx('数据与决策')}" style="width:100%;margin-top:8px">查看数据口径与校核 →</button>`)}</div><div class="bottom">${panel('01 / 投资构成',investment(true))}${panel('02 / 年度现金流与利润',waterfall(true))}${panel('03 / 热量交付与差额',heatSplit(true))}</div>`}
function demand(){return `<div class="grid3">${stat('用户侧年有效热量',fmt(D.userHeat/1e6,6),'GWh/年','heat')}${stat('热源侧年热量 · 原报值',fmt(D.sourceHeat/1e6,6),'GWh/年','heat')}${stat('年辅机电耗',fmt(D.auxElectricity/1e6,5),'GWh/年','blue')}</div><div class="grid2" style="margin-top:18px">${panel('年度热量结构',heatSplit()+note('热量差额 = 866,479 − 802,296 = <b>64,183 kWh</b>。原文称输配与储热损失；由于热源侧同时被标为燃料侧输入，尚不能确认差额全部为输配损失。'))}${panel('需求与热量原始数据',table(['指标','数值','口径'],[['日用水量','60.00 m³/日','报告需求侧'],['年用户侧热量','802,296 kWh','末端有效热量'],['年热源侧热量','866,479 kWh','边界存在歧义'],['辅机电耗','25,990 kWh/年','原文件直接给定'],['辅机占比',fmt(D.auxElectricity/D.sourceHeat*100,2)+'%','辅机电量/热源侧热量'],['热源热效率','0.93','低位热值口径']]))}</div><div class="grid2" style="margin-top:18px">${panel('售水量一致性校核',`<p class="callout">年产（售）热水量 15,330 m³/年</p><p>引擎口径：60 m³/日 × 365 天 × 年利用率 70% = <b class="cyantext">15,330 m³/年</b>（出参 water_out）。</p><p class="muted">与原报金额反推值交叉核对：536,500 ÷ 35 = ${fmt(calc.impliedAnnualWater,2)} m³/年，差 <b>${fmt(Math.abs(calc.impliedAnnualWater-15330),2)} m³</b>（${fmt(Math.abs(calc.impliedAnnualWater-15330)/15330*100,4)}%），仅因原报收入取整到百元。</p>${note('年利用率 70%（util_rate）是引擎对入住率/负荷率的统一假设，用于把日设计水量折为年计量水量；原本只有日用水量 60 m³，年售水量由该假设推算，非实测计量值。')}`)}${panel('工程数据完整性','<p class="callout">设计工况已明确 · 仅缺小时级曲线</p><p class="muted">供水 60 ℃、冷水 15 ℃、储热温差 45 ℃、有效容积系数 0.85、时变化系数 K<sub>h</sub> = 3.5、年运行 365 天、年利用率 70%、管网与储罐热损 8%。仍缺的是<b>逐时用水曲线</b>与回水温度设计值。</p><p>用水定额假设：600 人（300 间客房 × 2 人/间）× 100 L/(人·日) = 60 m³/日。</p><p>因此不绘制逐时曲线；但日/年热量、储热可用量、燃气消耗与碳排均可由上述参数逐一复算（见「储热容量」「碳排放」页）。</p>')}</div>`}
function storage(){return `<div class="grid3">${stat('储热设计容积','28.24','m³','purple')}${stat('设计小时负荷降低',fmt(calc.loadReduction,2),'kW','green')}${stat('相对降低比例',fmt(calc.loadReductionRatio,2),'%','green')}</div><div class="grid2" style="margin-top:18px">${panel('储热对设计小时负荷的影响',bars([['不配储热',D.unbufferedLoad,C.gray,2],['配储热',D.bufferedLoad,C.heat,2]],500,'kW')+note('降低比例 = (457.93 − 183.70) ÷ 457.93 = <b>59.8847%</b>。这是设计小时热负荷对比，不能等同于实测用电削峰或节能率。'))}${panel('储热容量与选型边界',table(['项目','取值 / 状态'],[['容积','28.24 m³ = 1,256.04 ÷ (1.163 × 45 × 0.85)'],['储热温差','45 ℃（供水 60 − 冷水 15）'],['有效容积系数','0.85（斜温层罐 0.80–0.90）'],['可用储热量 / kWh','1,256.04 = 28.24 × 1.163 × 45 × 0.85'],['原报“覆盖率” 152.7%','= 可用储热 1,256.04 ÷ 尖峰 3 h 需热 822.71'],['等效释热时长','4.58 h（1,256.04 ÷ 822.71 × 3 h）']],true)+note('原图把“覆盖率 152.7%”与 kW 并列书写，百分比本身无量纲；其分母为尖峰 3 h 的需热量 822.71 kWh，现已可逐位复现。'))}</div><div style="margin-top:18px">${panel('工程解释与运行策略','<p>储热可利用非高需求时段积蓄热量，在集中用水时段向末端释放，降低热源承担的设计小时峰值。</p><p class="muted">设计温差 45 ℃ 已给定（28.24 m³ 即由其反算），可用储热 1,256.04 kWh，为尖峰 3 h 需热的 152.7%；但负荷时间分布与完整水力方案未给定，仍不能验证该容积能否覆盖所有高峰时段。三维场景中的路径切换为功能示意。</p><button data-go="0">返回三维系统查看路径 →</button>')}</div>`}
function unitEconomics(){return bars([['单位现金成本',D.unitCashCost,C.blue,2],['单位完全成本',D.unitFullCost,C.purple,2],['原报销售单价',D.price,C.gold,2]],40,'元/m³')}
function economy(){return `<div class="grid3">${stat('初始总投资','25.22','万元','gold')}${stat('静态 / 动态回收期','1.14 / 1.25','年','gold')}${stat('原算例 IRR','87.41','%','gold')}</div><div class="notice">税前原算例：未计人工、维修费；总投资及收益结果依赖原文件参数。评价期 15 年、折现率 8%、年金系数 8.5595；按零税零残值复算：NPV = 22.045 × 8.5595 − 25.217 = <b>163.48 万元</b>，动态回收期 1.25 年，IRR 87.41%。原文件未列税费与残值，本页按 0 处理（偏乐观）。</div><div class="grid2">${panel('年度现金流与会计利润',waterfall()+note('净现金流 53.65 − 31.61 = 22.04 万元；再减非现金折旧1.68万元，得到税前利润20.36万元。折旧不应重复作为现金支出扣除。'))}${panel('单位经济性 · 同一量纲',unitEconomics()+note('21.72元/m³为原算例完全成本；未含完整人工、维修与税费，不能当作实际项目最终保本报价。'))}${panel('投资构成',investment()+note('配套按设备40%计：展示值(13.78+4.24)×40%=7.208万元，与原报7.20万元存在80元差额，可能与舍入有关；原值均保留。'))}${panel('财务指标与公式',table(['指标','结果 / 算法'],[['售水收入','536,500 元/年'],['原报运行成本','316,100 元/年'],['净现金流','220,400 元/年'],['折旧（非现金）','16,800 元/年'],['税前利润','203,600 元/年'],['静态回收期复算',fmt(D.capex/D.cashflow,4)+' 年 ≈ 1.14年'],['税前利润率复算',fmt(D.profit/D.revenue*100,2)+'%'],['NPV（8%，15 年）','163.48 万元 = 22.045 × 8.5595 − 25.217']]))}</div><div style="margin-top:18px">${panel('售价敏感性 · 用户可调假设',`<div class="sectionhead"><div><span class="muted">假设售价（默认沿用原报值）</span><div class="metricbig gold"><output id="priceValue">${fmt(assumedPrice,2)}</output><span class="unit">元/m³</span></div></div><span class="badge">条件测算 · 非新增预测</span></div><label for="priceRange" class="micro">拖动或用键盘调整售价；年售水量及成本固定</label><input id="priceRange" type="range" min="10" max="50" step="0.5" value="${assumedPrice}"/><div id="priceResults"></div><p class="micro">近似年售水量=收入/售价=${fmt(calc.impliedAnnualWater,2)} m³；运行成本31.61万元、折旧1.68万元保持不变，税前且不增加人工/维修费。售价变化不修改原始结果。</p>`)}</div>`}
function carbon(){return `<div class="grid3">${stat('原报年碳排','203.04','tCO₂/年','red')}${stat('用户侧单位热量碳强度',fmt(calc.carbonUser,4),'kgCO₂/kWh热','heat')}${stat('原报单位热水碳排','13.24','kgCO₂/m³','red')}</div><div class="grid2" style="margin-top:18px">${panel('相同碳排分子 · 不同热量分母',bars([['用户侧',calc.carbonUser,C.heat,4],['热源侧',calc.carbonSource,C.blue,4]],.30,'kgCO₂/kWh热')+note('203,040 ÷ 802,296 = 0.2531；203,040 ÷ 866,479 = 0.2343。差异来自评价分母，不代表两套方案或减排效果。'))}${panel('碳核算可追溯性',table(['项目','来源 / 限制'],[['年碳排','203.04 tCO₂（引擎出参 203,038.6 kg）'],['燃料种类 / 消耗量','天然气 85,950 m³/年（8.60 万 m³）'],['燃料排放 · 93.1%','189,090 kg = 85,950 × 2.20 kg/m³'],['辅机电力排放 · 6.9%','13,948.6 kg = 25,994.4 kWh × 0.5366 kg/kWh'],['合计校验','189,090 + 13,948.6 = 203,038.6 kg ≡ 203.04 t ✓'],['基准方案碳排','未给出 · 无基准方案，故不计减排量']],true)+note('年碳排已按燃料与辅机电量两条路径完整拆分，两项之和与原报值逐位一致（203,038.6 kg）。储热只改变小时负荷分布、不改变年热量，本身不产生碳排变化，不能认定为减碳。'))}</div><div style="margin-top:18px">${panel('电力排放因子口径敏感性',table(['核算口径','因子 kgCO₂/kWh','年碳排 tCO₂','相对引擎默认'],[['2022 全国电力平均（引擎默认）','0.5366','203.04','基准'],['2023 全国电力平均','0.5306','202.88','−0.08%'],['2022 广东省级','0.4403','200.54','−1.23%'],['2022 南方区域','0.3869','199.15','−1.92%']])+note('燃气排放 189,090 kg 按化学计量 2.20 kgCO₂/m³ 核算，<b>不随电力因子变化</b>，占 93.1%；辅机电力排放仅占 6.9%，因此把因子从全国 0.5366 换成广东省级 0.4403 只降低 1.23%（2.50 t），不改变“燃气是主要碳源”的结论，也不改变“储热不减碳”的判断。因子来源：生态环境部、国家统计局《关于发布 2022 年电力二氧化碳排放因子的公告》及 2023 年同名公告（南方区域取该公告表 2）。'))}</div><div class="notice">按引擎年产（售）热量 15,330 m³ 复算单位热水碳排：203,040 ÷ 15,330 = <b>13.2446 ≈ 13.24 kgCO₂/m³</b>，与原报值一致。若改用金额反推的 15,328.57 m³，则为 13.2459，差 0.0013 —— 说明原报 13.24 是按 15,330 m³ 口径算的，不是舍入误差。</div>`}
function evidence(){return `<div class="grid2">${panel('方案结论与决策边界','<p class="callout warm">储热降低了原算例的设计小时负荷</p><p>457.93 kW 降至 183.70 kW，降幅 59.88%。储热容积 28.24 m³（ΔT 45 ℃）可提供 1,256.04 kWh，是尖峰 3 h 需热的 152.7%，容量不是短板；逐时负荷曲线缺失，全时段匹配仍需专项核验。</p><div class="divider"></div><p class="callout gold">收益指标应按完整项目边界复核</p><p class="muted">1.14年回收期与87.41% IRR来自税前、未计人工/维修费的原文件结果。补齐费用通常会降低现金流，不能将原数值认定为实际项目保证收益。</p>')}${panel('数据分类',table(['类别','内容'],[['设计参数','日水量、设计负荷、储热容积'],['原报计算结果','热量、辅机电耗、投资及财务指标'],['本页复算','热损差额、储热可用量与覆盖率、静态/动态回收期、NPV、碳强度、碳排拆分、九种热源比选'],['条件假设','售价敏感性：其他变量固定'],['监测数据','暂无'],['接入边界','未连接 EMS / BMS / SCADA']],true))}</div><div style="margin-top:18px">${panel('数据口径与边界说明',table(['项目','说明'],[['热源侧热量 866,479 kWh','= 用户侧 802,296 × 1.08；差额 64,183 kWh 即 8.0% 管网与储罐综合热损（原称“输配损失率 7.41%”是同一差额除以热源侧）'],['热源热效率 0.93','低位热值口径，与交付比率 92.59% 不是同一概念'],['辅机电耗 25,990 kWh/年','占热源侧热量的 3.00%，不是总输入能源中电量的占比'],['储热覆盖率 152.7%','无量纲比值 = 可用储热 1,256.04 ÷ 尖峰 3 h 需热 822.71；原图与 kW 并列书写，易误读为容量'],['税前利润率 37.95% · 单位利润 13.28 元/m³','均为税前口径，未计人工与维修费'],['回收期 1.14 / 1.25 年 · IRR 87.41%','零税、零残值口径；安装费按设备投资 40% 计（分项复算差 80 元，属舍入）'],['年售水量 15,330 m³','= 60 × 365 × 70%；与收入/售价反推的 15,328.57 m³ 对账，差 1.43 m³']],true))}</div><div style="margin-top:18px">${panel('使用与源数据','<div style="max-width:1000px"><p>本文件可用 Chrome 或 Edge 离线打开，HTML、CSS、JavaScript、图表、三维模型及<b>原始 HTML</b> 均已内嵌。</p><p class="muted"><b>原始 HTML 保持原样、未作任何修改。</b>它的可见文字只有 1,256 个字符（含图表标注），且「燃气 / 锅炉 / 热泵 / 余热 / 天然气」等字样<b>一次都没有出现</b>。热源为商用燃气热水机组、九种热源比选、年耗天然气 85,950 m³、碳排的燃料/电力拆分、可用储热 1,256.04 kWh 等，都是<b>引擎返回、但原文可视化未呈现</b>的字段 —— 本页从引擎出参补齐，并逐项标注来源与算法。</p><p class="muted">三维外形与管路为功能示意。单机型号与台数、管径、阀位与水力布置未由原文件给出，不用于施工。</p><p class="micro">原文未给出的字段 —— 单机型号与台数、逐时用水曲线、回水温度、实时流量与温度、现场运行状态、基准方案碳排、监测数据 —— 页面一律标注为未提供；其余均已由引擎出参补齐并注明出处；敏感性试算与原报结果分别标注。</p></div><div class="tabs" style="margin-top:18px"><button id="exportData">导出核对数据 JSON</button><button id="showSource">查看原始 HTML</button></div>')}}</div>`}
function source(){
  const bm=D.benchmark, chosen=bm.find(x=>x.key===D.heatSrc)||bm[0];
  const maxC=Math.max(...bm.map(x=>x.cost));

  const investRank=bm.slice().sort((a,b)=>a.investWan-b.investWan).findIndex(x=>x.key===D.heatSrc)+1;
  const items=bm.map(x=>[x.name,x.cost,x.key===D.heatSrc?C.heat:C.gray,2]);
  const hp=bm.find(x=>x.key==='ashp'), wh=bm.find(x=>x.key==='waste_heat');

  const reasons=[
    ['依据 01','免锅炉房 · 免持证司炉工','常压/微压运行，可放在屋顶或设备间就近布置，省去独立锅炉房的土建与报建 —— 对寸土寸金的酒店很关键。'],
    ['依据 02','多台并联 · 随用随开','酒店入住率波动大（旺季满房、淡季空置），并联机组按实际负荷逐台启停，待机损失低，避免「大马拉小车」。'],
    ['依据 03','出力不受室外气温影响','工况修正系数 <b>1.0000</b>；空气源热泵在广州设计工况（室外 5.2 ℃）只有 <b>0.8915</b>，选型须按 <b>1.12 倍</b>铭牌容量放大，容量确定不如燃气直接。']];

  b+=KR('九种中排名','第 '+rank+' 位 / 共 '+bm.length+' 种','');
  b+=KR('初始投资',fmt(chosen.investWan,2)+' 万元','');
  b+=KR('投资由低到高','第 '+investRank+' 位','green');
  b+=KR('年碳排',fmt(chosen.carbonT,2)+' tCO₂','red');
  b+='</div>';
  b+='<div class="divider"></div>';
  b+='<div class="eyebrow">为什么是它 —— 与更便宜方案的距离</div>';
  b+='<p>就单位热水成本而言，被选方案<b class="gold">不是最便宜的</b>：</p>';
  b+='<div class="metrics">';
  b+=KR('工业余热（最低）',fmt(wh.cost,2)+' 元/m³','green');
  b+=KR('空气源热泵（次低）',fmt(hp.cost,2)+' 元/m³','green');
  b+=KR(D.heatSrcName+'（被选）',fmt(chosen.cost,2)+' 元/m³','gold');
  b+='</div>';
  b+='<p class="micro">空气源热泵比被选方案低 '+fmt(chosen.cost-hp.cost,2)+' 元/m³（−'+fmt((1-hp.cost/chosen.cost)*100,1)+'%），但初始投资 '+fmt(hp.investWan,2)+' 万元，是被选方案 '+fmt(chosen.investWan,2)+' 万元的 '+fmt(hp.investWan/chosen.investWan,2)+' 倍。</p>';
  b+=note('原报告<b class="gold">未说明选型理由</b>；本卡下文给出本次默认口径的依据与可切换方案。本页保留引擎比选结果与原始选型，不替换方案；若项目有真实余热源或电价更敏感，应重新比选。');
  b+='<div class="divider"></div>';
  b+='<div class="eyebrow">为什么是商用燃气热水机组</div>';
  b+='<p class="callout">提问只给了「广州一家酒店 300 间客房」，<b>没有指定热源类型</b>。</p>';
  b+='<p>热源未指定时，取<b>商用燃气热水机组</b>作为行业默认起点 —— 不是凭空推荐，而是酒店与医院中小型热水系统的常见做法；引擎随后把九种热源放在<b>同一负荷、同一气电价格</b>口径下逐一比选（见右图）。</p>';
  b+='<p class="micro">⚠️ 这是<b>选型决策</b>，不是引擎代码缺省：引擎的缺省值（heat_src 未传）是<b>冷凝式燃气锅炉</b>（cond_boiler，20.12 元/m³、投资 35.50 万元）。本算例显式指定 gas_heater，因此全部结果按商用燃气热水机组口径计算。</p>';
  b+='<div style="display:grid;gap:10px;margin-top:12px">'+reasons.map(box).join('')+'</div>';
  b+='<p class="micro" style="margin-top:12px">因此它是酒店与医院中小型热水系统的主流做法。⚠️ 本引擎的配套系数未区分「是否需要锅炉房 / 烟囱 / 报建」的土建差异，这部分要按实际项目另计。</p>';

  const chart=panel('九种热源比选 · 单位热水成本',bars(items,maxC*1.06,'元/m³ ')+note('极差 '+fmt(bm[0].cost,2)+' → '+fmt(bm[bm.length-1].cost,2)+' 元/m³，约 '+fmt(bm[bm.length-1].cost/bm[0].cost,1)+' 倍。橙色为被选方案。'));
  const basis=panel('比选口径与适用边界',table(['项目','取值 / 说明'],[
    ['比选基准',D.benchmarkBasis],
    ['气价 / 电价','天然气 3.45 元/m³ · 电 0.753 元/kWh'],
    ['热值口径','10.84 kWh/m³ 低位热值'],
    ['负荷工况','日用水 '+fmt(D.dailyWater,0)+' m³ · 设计小时负荷 '+fmt(D.unbufferedLoad,2)+' kW'],
    ['工业余热','最便宜，但须有可用余热源，且未计接入投资'],
    ['电热水器',fmt(bm[bm.length-1].cost,2)+' 元/m³（含电锅炉直热），运行成本最高']],'nw1'));
  return '<div class="grid2">'
    +'<div style="min-width:0">'+panel('选型结论与依据',b)+'</div>'
    +'<div style="min-width:0">'+chart+'<div style="margin-top:18px">'+basis+'</div></div>'
    +'</div>';
}
const renderers=[overview,demand,source,storage,economy,carbon,evidence],english=['','DEMAND & ENERGY','HEAT SOURCE','THERMAL STORAGE','TECHNO-ECONOMICS','CARBON ACCOUNTING','EVIDENCE & DECISIONS'];
function render(){hideTip();$('#nav').innerHTML=modules.map((m,i)=>`<button data-go="${i}" class="${i===current?'active':''}" aria-current="${i===current?'page':'false'}">0${i} ${m}</button>`).join('')+`<div class="tools"><button id="motion" aria-pressed="${document.body.classList.contains('still')}">动画：${document.body.classList.contains('still')?'关闭':'开启'}</button><button id="full">全屏</button></div>`;$('#main').innerHTML=(current?`<div class="sectionhead"><div class="detailtitle"><span class="number">0${current}</span><div><div class="eyebrow">${english[current]}</div><h2>${modules[current]}</h2></div></div><button data-go="0">← 返回总览</button></div>`:'')+renderers[current]();if(current===0)initTwin();if(current===idx('技术经济'))updatePrice()}
function go(n){current=n;render();window.scrollTo({top:0,behavior:'instant'})}
function updatePrice(){const revenue=calc.impliedAnnualWater*assumedPrice,cf=revenue-D.opex,profit=cf-D.depreciation;$('#priceValue').textContent=fmt(assumedPrice,2);$('#priceResults').innerHTML=`<div class="grid3" style="margin-top:12px">${stat('条件年收入',fmt(revenue/1e4,2),'万元','gold')}${stat('条件净现金流',fmt(cf/1e4,2),'万元',cf>=0?'green':'red')}${stat('条件税前利润',fmt(profit/1e4,2),'万元',profit>=0?'green':'red')}</div>`}
