const D=JSON.parse(document.querySelector('#project-data').textContent),$=s=>document.querySelector(s),fmt=(v,n=0)=>v.toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n});
const C={cyan:'#28d8ff',blue:'#579af8',purple:'#a18bff',gold:'#ffc857',green:'#36d6a0',red:'#ff697e',gray:'#7996b9'};
const calc={loadResidual:D.pvSelf+D.storageDischarge+D.gridDirect-D.load,gridResidual:D.gridDirect+D.storageCharge-D.gridAfter,pvResidual:D.pvSelf+D.pvExport+D.pvCurtailment-D.pvGeneration,boundaryResidual:D.gridAfter+D.pvGeneration-D.pvExport-D.load-D.storageLoss,roundtrip:D.storageDischarge/D.storageCharge*100,gridReduction:D.gridBefore-D.gridAfter,demandReduction:D.demandBefore-D.demandAfter,billReduction:D.billBefore-D.billAfter,incrementalCapex:D.schemes[1].capex-D.schemes[0].capex,incrementalIncome:D.schemes[1].netIncome-D.schemes[0].netIncome};
const modules=['系统总览','光伏与电量','储能与需量','技术经济','碳排与价值','数据与决策'];let current=0,scheme=2,returnFocus=null,benefitRetention=100;
function panel(title,body,extra=''){return `<section class="panel"><div class="panelhead"><h3>${title}</h3>${extra}</div><div class="pad">${body}</div></section>`}
function note(t){return `<div class="insight">${t}</div>`}function table(headers,rows){return `<div class="datawrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function stat(l,v,u,col='cyan'){return `<div class="statbox"><span class="muted">${l}</span><b style="color:${C[col]}">${v}<span class="unit">${u}</span></b></div>`}
function svg(content,h=250){return `<svg class="chart" viewBox="0 0 600 ${h}" role="img">${content}</svg>`}function tip(t){return `tabindex="0" data-tip="${t}"`}
function bars(items,max,unit){return svg(`<text x="18" y="24">${unit} · 各行共用此单位</text>`+items.map((r,i)=>{let y=58+i*61,w=r[1]/max*345;return `<g ${tip(r[0]+'：'+fmt(r[1],r[3]??2)+' '+unit)}><text x="18" y="${y}">${r[0]}</text><rect x="175" y="${y-14}" width="${w}" height="9" rx="4" fill="${r[2]}"/><text class="val" x="175" y="${y+24}">${fmt(r[1],r[3]??2)}</text></g>`}).join(''),50+61*items.length)}
function schemeOptions(){return `<div class="scenarioList">${D.schemes.map((s,i)=>`<button class="scenarioOption ${scheme===i?'active':''}" data-scheme="${i}"><span style="color:${i===0?C.cyan:C.purple}">0${i+1}</span><span><b>${s.name}</b><small>${fmt(s.capex/1e4)}万元 · ${s.payback.toFixed(2)}年</small></span><span class="badge">${scheme===i?'已选中':i===2?'本次设计':'查看'}</span></button>`).join('')}</div>`}
function kpis(){const x=[['园区年用电量',fmt(D.load/1e6,2),'GWh/年','需求侧 · 改造前后不变',1,'cyan'],['光伏装机容量',fmt(D.pvCapacity),'kWp','22° · 正南',1,'cyan'],['储能额定容量',fmt(D.storageEnergy),'kWh','500 kW / 4h · LFP',2,'purple'],['改造后最大需量',fmt(D.demandAfter,2),'kW','原报基准 1,209.50 kW',2,'blue'],['本次设计初投资','684','万元','方案③ · 充电负荷0',3,'gold'],['本次年净收益','177.85','万元/年','年收入减运维费用',3,'gold'],['本次静态回收期','3.85','年','纯光伏方案为2.77年',3,'gold'],['原报年碳减排',fmt(D.carbonReduction,2),'tCO₂','因子 '+D.carbonEf+' kg/kWh<br>2022 全国平均',4,'green']];return `<div class="kpis">${x.map(a=>`<button class="kpi" data-go="${a[4]}" style="--accent:${C[a[5]]}"><div class="label">${a[0]}</div><div class="value">${a[1]}<span class="unit">${a[2]}</span></div><small>${a[3]}</small></button>`).join('')}</div>`}
function pvDonut(compact=false){const p=D.pvSelf/D.pvGeneration*100,cy=compact?86:122,r=compact?55:77;return svg(`<circle cx="108" cy="${cy}" r="${r}" pathLength="100" fill="none" stroke="${C.green}" stroke-width="${compact?15:22}"/><circle ${tip('光伏自用：1,346,926 kWh/年')} cx="108" cy="${cy}" r="${r}" pathLength="100" fill="none" stroke="${C.cyan}" stroke-width="${compact?15:22}" stroke-dasharray="${p} ${100-p}" transform="rotate(-90 108 ${cy})"/><text class="val" x="108" y="${cy}" text-anchor="middle">${fmt(p,2)}%</text><text x="108" y="${cy+22}" text-anchor="middle">自用占比</text><text x="220" y="${compact?45:70}" style="fill:${C.cyan}">光伏自用</text><text class="val" x="220" y="${compact?70:96}">1,346,926 kWh</text><text x="220" y="${compact?112:151}" style="fill:${C.green}">余电上网</text><text class="val" x="220" y="${compact?137:177}">47,303 kWh</text>`,compact?180:245)}
function demandMini(){return svg(`<text x="14" y="29">改造前最大需量</text><rect x="205" y="16" width="265" height="9" rx="4" fill="${C.gray}"/><text class="val" x="205" y="53">1,209.50 kW</text><text x="14" y="97">改造后最大需量</text><rect x="205" y="84" width="${265*D.demandAfter/D.demandBefore}" height="9" rx="4" fill="${C.cyan}"/><text class="val" x="205" y="121">705.40 kW</text><text x="14" y="163">设计模拟下降 ${fmt(calc.demandReduction/D.demandBefore*100,2)}% · 非实时功率</text>`,180)}
function incomeMini(){const s=D.schemes[scheme];return svg(`<text x="14" y="27">当前查看 · ${s.name}</text><text x="14" y="67">年收入</text><text class="val" x="205" y="67" style="fill:${C.gold}">${fmt(s.grossIncome/1e4,2)} 万元/年</text><text x="14" y="111">年运维费用</text><text class="val" x="205" y="111">−${fmt(s.opex/1e4,2)} 万元/年</text><text x="14" y="155">年净收益</text><text class="val" x="205" y="155" style="fill:${C.green}">${fmt(s.netIncome/1e4,2)} 万元/年</text>`,180)}
function overview(){let s=D.schemes[scheme];return kpis()+`<div class="cockpit">${panel('三方案选型对比',schemeOptions()+note('充电负荷 <b>0 kW</b>，方案②与③的投资、年净收益和回收期一致。')+`<div class="divider"></div><div class="row"><span>当前查看</span><strong>${s.name}</strong></div><div class="row"><span>投资规模</span><strong class="gold">${fmt(s.capex/1e4)} 万元</strong></div><div class="row"><span>静态回收期</span><strong>${s.payback.toFixed(2)} 年</strong></div><p class="micro">页面顶栏KPI为原文件“本次设计”方案③。这里切换方案用于比较，不修改原设计结果。</p>`)}<section class="panel"><div class="panelhead"><h3>光储充系统 · 三维工程场景</h3><span class="badge cyan">功能拓扑示意</span></div><div class="stage" id="stage"><svg id="twin" viewBox="0 0 1000 570" aria-label="可旋转缩放的光伏储能供电系统示意"></svg><div class="stagehud"><b>POWER SYSTEM / AXONOMETRIC</b><div>拖动旋转 · 滚轮缩放 · 点击设备查看设计参数</div></div></div><div class="controls"><div class="tabs" id="modes"><button class="active" data-mode="pv">光伏自用</button><button data-mode="charge">谷充示意</button><button data-mode="discharge">峰放示意</button><button data-mode="export">余电上网</button></div><div><button id="flowToggle">流向：显示</button> <button id="resetView">恢复视角</button></div></div><div class="footnote"><div class="legend"><span><i></i>光伏电力</span><span><i style="--color:${C.blue}"></i>电网</span><span><i style="--color:${C.purple}"></i>储能</span><span><i style="--color:${C.gold}"></i>负荷</span><span><i style="--color:${C.green}"></i>上网</span></div><div class="flowdesc" id="pathNote">光伏 → 逆变器 → 交流母线 → 园区负荷。场景流向为设计示意，不代表现场运行。</div></div></section>${panel('改造价值与评价边界',`<div class="row"><span>原报年电费减少</span><strong class="green">${fmt(calc.billReduction/D.billBefore*100,2)}%</strong></div><div class="metricbig gold">${fmt(calc.billReduction/1e4,2)} <span class="unit">万元/年</span></div><div class="micro">464.57 → 276.88 万元/年</div><div class="divider"></div><div class="metrics"><div class="row"><span>购电量减少</span><strong class="green">${fmt(calc.gridReduction/1e6,5)} GWh</strong></div><div class="row"><span>最大需量减少</span><strong class="green">${fmt(calc.demandReduction,2)} kW</strong></div><div class="row"><span>储能年损耗</span><strong style="color:${C.purple}">${fmt(D.storageLoss)} kWh</strong></div></div>${note('储能是能量转移装置，<b>不作为一次发电来源</b>；收益应扣除运维并结合增量投资评价。')}<div class="divider"></div><p class="micro">纯光伏方案的初投资和静态回收期更低；本次设计不等于所有目标下的最优方案。</p><button data-go="5" style="width:100%;margin-top:5px">查看平衡校核与决策 →</button>`)}</div><div class="bottom">${panel('01 / 光伏发电去向',pvDonut(true))}${panel('02 / 最大需量对比',demandMini())}${panel('03 / 方案年收益',incomeMini())}</div>`}
function energyBalance(){return svg(`<text x="18" y="27">负荷供给端构成 · GWh/年</text>${[['光伏直接自用',D.pvSelf,C.cyan],['储能放电',D.storageDischarge,C.purple],['电网直接供负荷',D.gridDirect,C.blue]].map((a,i)=>{let x=22,y=64+i*69;return `<g ${tip(a[0]+'：'+fmt(a[1])+' kWh/年')}><text x="${x}" y="${y}">${a[0]}</text><rect x="203" y="${y-13}" width="${a[1]/D.load*310}" height="10" rx="4" fill="${a[2]}"/><text class="val" x="203" y="${y+23}">${fmt(a[1]/1e6,6)}</text></g>`}).join('')}<text x="18" y="282">三项合计4.800000 GWh，储能放电来自先前电网充电。</text>`,305)}
function pvpage(){return `<div class="grid3">${stat('光伏年发电量',fmt(D.pvGeneration/1e6,6),'GWh/年')}${stat('光伏自用率',fmt(D.pvSelf/D.pvGeneration*100,2),'%')}${stat('余电上网量',fmt(D.pvExport/1e6,6),'GWh/年','green')}</div><div class="grid2" style="margin-top:18px">${panel('光伏发电去向',pvDonut()+note('原文件发电量精细值1,394,228.90 kWh；自用与上网均为整数，合计相差0.10 kWh，按展示舍入保留。'))}${panel('负荷侧年度电量平衡',energyBalance())}${panel('外部边界与储能损耗',table(['平衡关系','数值 / 复算'],[['电网直供 + 储能充电','2,954,205 + 566,385 = 3,520,590 kWh'],['储能充电 − 储能放电','566,385 − 498,869 = 67,516 kWh'],['购电 + 发电 − 上网 − 负荷 − 损耗','−0.10 kWh · 发电展示精度差'],['购电减少量','1,279,410 kWh'],['光伏自用 − 储能损耗','1,346,926 − 67,516 = 1,279,410 kWh']])+note('负荷侧供给构成与外部购电分开计算；储能充电不能与储能放电重复计作独立供给。'))}${panel('设计参数与等效小时',table(['项目','原报值 / 复算'],[['光伏装机','1,200 kWp'],['方位 / 倾角','正南 / 22°'],['弃电量','0 kWh/年 · 原报结果'],['光伏等效小时原报','1,161.90 h'],['按发电量/容量复算',fmt(D.pvGeneration/D.pvCapacity,4)+' h'],['园区负荷利用小时原报','3,968.70 h'],['按年电量/最大需量复算',fmt(D.load/D.demandBefore,4)+' h'],['负荷率复算',fmt(D.load/(D.demandBefore*8760)*100,2)+'%']])+'<p class="micro">原报利用小时与显示值复算存在小差异，可能来自未展示精度；原值保留，不静默覆盖。暂无逐时发电或负荷曲线。</p>')}</div>`}
function storagepage(){return `<div class="grid3">${stat('额定容量 / 功率','2,000 / 500','kWh / kW','purple')}${stat('标称时长','4','h','purple')}${stat('年充放电效率复算',fmt(calc.roundtrip,2),'%','purple')}</div><div class="grid2" style="margin-top:18px">${panel('储能年度充放电与损耗',bars([['储能充电',D.storageCharge,C.blue,0],['储能放电',D.storageDischarge,C.purple,0],['储能损耗',D.storageLoss,C.gray,0]],650000,'kWh/年')+note('往返效率=498,869/566,385=88.0795%；原报88.08%。该值为全年电量比，不是设备实时SOC。'))}${panel('最大需量对比',bars([['改造前',D.demandBefore,C.gray,2],['改造后',D.demandAfter,C.cyan,2]],1400,'kW')+note('最大需量降低504.10 kW，约41.68%。这是光储组合方案结果，缺少逐时负荷及调度，不能将全部降幅归因于储能。'))}${panel('储能运行设计口径',table(['指标','数值 / 状态'],[['电芯体系','LFP'],['运行策略','谷充峰放 · 原文件'],['原报年循环次数','311.8 次/年'],['充电量/额定容量',fmt(D.storageCharge/D.storageEnergy,3)+' 次'],['放电量/额定容量',fmt(D.storageDischarge/D.storageEnergy,3)+' 次'],['循环计数口径','放电量 ÷ 可用容量 1,600 kWh（2,000 × 80% DoD）= 311.8 次/年'],['实时SOC / 温度 / 功率','暂无数据']]))}${panel('充电负荷边界','<p class="callout">本算例充电桩计算负荷为 <b class="cyantext">0 kW</b></p><p>原字段 ev_calc_kw=0。因此方案②“光伏+储能”与方案③“光储充”的投资、净收益和静态回收期相同。</p><p class="muted">场景中充电接口以灰色表示功能预留；不暗示已安装桩数，不增加充电售电量、充电服务收入或车辆数据。</p>')}</div>`}
function costComparison(){let rows=[['改造前综合电价',D.priceBefore,C.gold],['改造后购电单价',D.priceAfter,C.blue],['光伏 LCOE',D.pvLCOE,C.green]];return bars(rows.map(a=>[...a,4]),1.1,'元/kWh')}
function schemeMetrics(){const s=D.schemes[scheme];return `<div class="grid3">${stat('当前方案 · 初投资',fmt(s.capex/1e4,2),'万元','gold')}${stat('当前方案 · 年净收益',fmt(s.netIncome/1e4,2),'万元/年','gold')}${stat('当前方案 · 静态回收期',fmt(s.payback,2),'年','gold')}</div>`}
function economics(){let s=D.schemes[scheme];return `<div class="sectionhead"><div class="tabs">${D.schemes.map((a,i)=>`<button data-scheme="${i}" class="${i===scheme?'active':''}">方案${i+1} · ${a.name}</button>`).join('')}</div><span class="badge">原文件设计结果 · 非保证收益</span></div>${schemeMetrics()}<div class="grid2" style="margin-top:18px">${panel('三方案初始投资',bars(D.schemes.map((a,i)=>[a.name,a.capex/1e4,i===0?C.cyan:C.purple,2]),750,'万元'))}${panel('三方案年净收益',bars(D.schemes.map((a,i)=>[a.name,a.netIncome/1e4,i===0?C.cyan:C.gold,2]),200,'万元/年'))}${panel('静态回收期',bars(D.schemes.map((a,i)=>[a.name,a.payback,i===0?C.cyan:C.purple,2]),4.5,'年')+note('静态回收期=初投资/年净收益。仅比较资金回收速度，不能据此单独判断全生命周期最优。'))}${panel(s.name+' · 收益口径',table(['指标','原报值 / 复算'],[['年收入',fmt(s.grossIncome/1e4,2)+' 万元/年'],['年运维费用',fmt(s.opex/1e4,2)+' 万元/年'],['年净收益',fmt(s.netIncome/1e4,2)+' 万元/年'],['回收期复算',fmt(s.capex/s.netIncome,4)+' 年'],['IRR',s.irr===null?'原文未单列':fmt(s.irr,2)+'% · 原报'],['NPV / 评价期 / 折现率','原文件未提供']]))}${panel('度电成本 · 三种评价边界',costComparison()+note('0.9679：年电费/总用电（原文含需量费摊入）；0.7865：改造后电费/购电量；0.5926：光伏全生命周期LCOE。分母及成本边界不同，不直接相减。'))}${panel('增配储能的边际经济性',`<div class="metricbig gold">${fmt(calc.incrementalCapex/calc.incrementalIncome,2)} <span class="unit">年 · 简化增量回收期</span></div><div class="divider"></div><p>增量投资 ${fmt(calc.incrementalCapex/1e4,2)} 万元；增量年净收益 ${fmt(calc.incrementalIncome/1e4,2)} 万元。</p><p class="micro">(684 − 384)/(177.85 − 138.72)≈7.67年。只按原报稳定年收益差试算，未计衰减、储能更换、寿命差异及时间价值。该值不同于组合方案整体回收期3.85年。</p>`)}</div><div style="margin-top:18px">${panel('收益敏感性 · 固定投资与年运维',`<div class="sectionhead"><div><span class="muted">当前方案年收入保留比例</span><div class="metricbig gold"><output id="retentionValue">${benefitRetention}</output><span class="unit">%</span></div></div><span class="badge">明确假设 · 不修改原报结果</span></div><label class="micro" for="incomeRange">拖动或用键盘调整：原报年收入的50%—120%，投资与运维保持不变</label><input id="incomeRange" type="range" min="50" max="120" step="1" value="${benefitRetention}"/><div id="sensitivityResults"></div><p class="micro">仅用于判断收入变化对静态回收的影响，不预测电价，也不外推IRR。</p>`)}</div>`}
function carbonpage(){return `<div class="grid3">${stat('原报年碳减排',fmt(D.carbonReduction,2),'tCO₂/年','green')}${stat('外购电量减少',fmt(calc.gridReduction/1e6,5),'GWh/年','green')}${stat('储能年电量损耗',fmt(D.storageLoss/1e6,6),'GWh/年','purple')}</div><div class="grid2" style="margin-top:18px">${panel('购电量变化',bars([['改造前购电',D.gridBefore/1e6,C.gray,5],['改造后购电',D.gridAfter/1e6,C.blue,5]],5.2,'GWh/年')+note('购电减少1,279,410 kWh = 光伏自用1,346,926 − 储能损耗67,516。该关系成立于本文件给定的年度边界。'))}${panel('碳核算依据与限制',table(['项目','原文件信息'],[['年碳减排','722.76 tCO₂ · 原报结果'],['电力排放因子','未提供'],['是否计入上网替代效益','未明确'],['是否扣除储能损耗影响','未明确'],['分时排放因子','未提供'],['生命周期排放边界','未提供']])+note('保留原报722.76 tCO₂，不由电量自行补造排放因子。现有文件不足以独立验证碳减排算法。'))}</div><div class="grid2" style="margin-top:18px">${panel('价值指标 · 分别保留量纲',`<div class="metrics"><div class="row"><span>年电费减少</span><strong class="gold">187.69 万元/年</strong></div><div class="row"><span>最大需量降低</span><strong class="green">504.10 kW</strong></div><div class="row"><span>年购电减少</span><strong class="green">1.27941 GWh</strong></div><div class="row"><span>原报年碳减排</span><strong class="green">722.76 tCO₂</strong></div></div><p class="micro">不同量纲不合并为同一数轴或无单位的综合评分。</p>`)}${panel('技术解释','<p class="callout">光伏提供电量，储能改变用电时段</p><p>储能充电量大于放电量。本算例通过谷充峰放参与经济优化与需量控制，但不能把放电量视为新增发电量。</p><p class="muted">缺少分时排放因子和逐时调度，不能直接认定移峰本身必然减碳。</p>')}</div>`}

function pathOf(pts){return pts.map((p,i)=>{let a=project(p);return `${i?'L':'M'}${a[0].toFixed(2)},${a[1].toFixed(2)}`}).join(' ')}
function drawTwin(){plant();let out='<defs><filter id="groundGlow"><feGaussianBlur stdDeviation="9"/></filter></defs>';let objects=[...polys.filter(p=>p.id).map(p=>({...p,kind:'poly'})),...pipes.map(p=>({...p,kind:'pipe'}))].sort((a,b)=>a.depth-b.depth);
polys.filter(p=>!p.id).forEach(p=>{let pts=p.pts.map(a=>project(a).slice(0,2).join(',')).join(' ');out+=`<polygon points="${pts}" fill="${p.color}" stroke="#365572" stroke-width=".8"/>`});
// 地面网格始终位于设备下面。
for(let x=-350;x<=350;x+=50)out+=`<path d="${pathOf([[x,-220,-2],[x,235,-2]])}" stroke="#2b537477" stroke-width=".6"/>`;for(let y=-220;y<=235;y+=50)out+=`<path d="${pathOf([[-350,y,-2],[350,y,-2]])}" stroke="#2b537477" stroke-width=".6"/>`;
objects.forEach(p=>{if(p.kind==='poly'){let pts=p.pts.map(a=>project(a).slice(0,2).map(x=>x.toFixed(1)).join(',')).join(' ');out+=`<polygon points="${pts}" fill="${p.color}" stroke="#d0f2ff25" stroke-width=".6" ${p.id?`data-equip="${p.id}" class="equipment ${selected===p.id?'selected':''}"`:''}/>`}else{let d=pathOf(p.pts),opacity=p.active?1:.14;out+=`<g opacity="${opacity}" data-tip="${p.text} · 设计流向示意"><path d="${d}" fill="none" stroke="#07172a" stroke-width="9" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${p.color}" stroke-width="5" stroke-linejoin="round"/>`;if(p.active&&showFlow){out+=`<path d="${d}" fill="none" stroke="#eaf6ff" stroke-width="2" class="flow"/>`;for(let i=1;i<p.pts.length;i++){let a=project(p.pts[i-1]),b=project(p.pts[i]),dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len>35){let x=a[0]+dx*.6,y=a[1]+dy*.6,theta=Math.atan2(dy,dx)*180/Math.PI;out+=`<path d="M-5,-4 L3,0 L-5,4" fill="none" stroke="#eaf6ff" stroke-width="2" transform="translate(${x},${y}) rotate(${theta})"/>`}}}out+='</g>'}});
labels.forEach(([name,p,id])=>{let a=project(p);out+=`<g class="equipment" data-equip="${id}" role="button" tabindex="0" aria-label="查看${name}参数"><rect x="${a[0]-name.length*10-10}" y="${a[1]-16}" width="${name.length*20+20}" height="31" rx="4" fill="#0a1d35e8" stroke="${selected===id?C.cyan:'#406387'}"/><text x="${a[0]}" y="${a[1]+2}" font-size="19" font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#eaf6ff" text-anchor="middle">${name}</text></g>`});$('#twin').innerHTML=out}
function initTwin(){mode='pv';showFlow=true;drawTwin();const stage=$('#stage');let start=null,moved=false;stage.onpointerdown=e=>{if(e.button!==0)return;start={x:e.clientX,y:e.clientY,a:angle,e:elevation};moved=false;stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){angle=start.a+dx*.004;elevation=Math.max(.3,Math.min(1.1,start.e+dy*.003));drawTwin()}};stage.onpointerup=e=>{if(!start)return;start=null;if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);if(!moved){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-equip]');if(el)showDevice(el.dataset.equip)}};stage.onpointercancel=()=>start=null;stage.onwheel=e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.5,zoom-e.deltaY*.001));drawTwin()};stage.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('[data-equip]');if(el){e.preventDefault();showDevice(el.dataset.equip)}}};$('#resetView').onclick=()=>{angle=-.54;elevation=.58;zoom=1;drawTwin()};$('#flowToggle').onclick=e=>{showFlow=!showFlow;e.target.textContent='流向：'+(showFlow?'显示':'隐藏');drawTwin()};$('#modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;$('#modes').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));$('#pathNote').textContent={pv:'光伏DC → 逆变器AC → 交流母线 → 园区负荷。电网可补充负荷。设计示意。',charge:'谷充示意：电网 → 交流母线 → PCS（AC→DC）→ 储能柜。非实时调度。',discharge:'峰放示意：储能柜 → PCS（DC→AC）→ 交流母线 → 园区负荷。非实时调度。',export:'余电上网：光伏DC → 逆变器AC → 交流母线 → 双向计量 / 电网。未提供实际逐时上网记录。'}[mode];drawTwin()}}
